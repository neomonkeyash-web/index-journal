<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>INDEX JOURNAL</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="index journal" />
<meta name="theme-color" content="#FFFFFF" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #FFF; color: #111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  input, textarea, button, label { font-family: inherit; }
  input { border: none; background: transparent; }
  input::placeholder { color: #C7C7C2; }
  input:focus, textarea:focus { outline: none; }
  button { background: none; border: none; cursor: pointer; padding: 0; color: inherit; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #DEDEDA; position: sticky; top: 0; background: #FFF; z-index: 10; }
  .bar.bottom { top: auto; bottom: 0; border-top: 1px solid #DEDEDA; border-bottom: none; }
  .tiny { font-size: 11px; letter-spacing: 0.15em; color: #9B9B95; }
  .tiny.ink { color: #111; }
  .tiny.blue { color: #1D1DE0; }
  .wrap { max-width: 680px; width: 100%; margin: 0 auto; padding: 0 24px; }
  .row { padding: 12px 0; border-bottom: 1px solid #DEDEDA; }
  .rowline { display: flex; align-items: center; gap: 16px; }
  .num { font-size: 11px; letter-spacing: 0.15em; color: #9B9B95; width: 22px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .letter { font-weight: 700; font-size: 20px; width: 24px; flex-shrink: 0; color: #111; }
  .letter.filled { color: #1D1DE0; }
  .qlabel { font-weight: 700; font-size: 15px; width: 90px; flex-shrink: 0; color: #111; }
  .qlabel.filled { color: #1D1DE0; }
  .txt { flex: 1; font-size: 17px; color: #111; padding: 4px 0; min-width: 0; }
  .imgbtn { flex-shrink: 0; font-size: 11px; padding: 4px 8px; border: 1px solid #9B9B95; color: #9B9B95; cursor: pointer; }
  .imgbtn.has { border-color: #1D1DE0; color: #1D1DE0; }
  .hintbtn { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; font-size: 11px; border: 1px solid #9B9B95; color: #9B9B95; }
  .nowbtn { flex-shrink: 0; font-size: 11px; padding: 4px 8px; border: 1px solid #1D1DE0; color: #1D1DE0; }
  .hint { margin-top: 8px; margin-left: 38px; font-size: 12px; color: #9B9B95; }
  .thumbwrap { display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; margin-left: 38px; }
  .thumb { height: 80px; width: 80px; object-fit: cover; border: 1px solid #DEDEDA; }
  .bigimg { margin-top: 8px; margin-left: 38px; max-height: 192px; max-width: calc(100% - 38px); object-fit: cover; border: 1px solid #DEDEDA; }
  .rm { font-size: 11px; color: #C0261C; padding: 4px 8px; }
  .primary { padding: 12px 28px; font-size: 14px; letter-spacing: 0.15em; background: #1D1DE0; color: #FFF; }
  .val { flex: 1; font-size: 16px; color: #111; }
  .val.empty { color: #C7C7C2; }
  .sharebtn { padding: 12px 24px; font-size: 13px; letter-spacing: 0.15em; }
  .hiddenfile { display: none; }
  #fallLayer { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .fallItem { position: absolute; top: -80px; will-change: transform; }
  .gear { font-size: 20px; line-height: 1; color: #9B9B95; letter-spacing: 0; }
  .menuRow { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; border-bottom: 1px solid #DEDEDA; width: 100%; text-align: left; }
  .menuRow .label { display: block; font-size: 16px; font-weight: 700; letter-spacing: 0.14em; color: #111; }
  .menuRow .desc { display: block; font-size: 12px; line-height: 1.6; color: #9B9B95; padding-top: 10px; }
  .swatch { display: flex; gap: 6px; align-items: center; }
  .sw { width: 18px; height: 18px; border: 1px solid #DEDEDA; }
  .paletteRow { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #DEDEDA; width: 100%; text-align: left; }
  .motifCell { width: 72px; height: 72px; border: 1px solid #DEDEDA; display: inline-block; margin: 0 8px 8px 0; position: relative; background: #FFF; }
  .motifCell img { width: 100%; height: 100%; object-fit: contain; }
  .motifDel { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: #C0261C; color: #FFF; font-size: 11px; line-height: 20px; text-align: center; }
  #drawCanvas { width: 100%; max-width: 320px; aspect-ratio: 1; border: 1px solid #111; touch-action: none; background: #FFF; display: block; }
</style>
</head>
<body>
<div id="root"><p style="padding:40px 24px" class="tiny">LOADING...</p></div>
<script>
"use strict";

window.onerror = function (msg, src, line) {
  var el = document.getElementById("root");
  if (el) el.innerHTML = '<p style="padding:40px 24px;color:#C0261C;font-size:12px;word-break:break-all">ERROR: ' + msg + ' (line ' + line + ')</p>';
};

var ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
var BLUE = "#1D1DE0";
var PALETTES = [
  { id: "001", name: "SIGNAL", bg: "#FFFFFF", ink: "#111111", accent: "#1D1DE0", line: "#E2E2DE", gray: "#9B9B95",
    mode: "single",
    pens: ["#C0261C", "#1D1DE0", "#E8B33A", "#2E8B57", "#9B9B95", "#111111", "#E86FA8"] },
  { id: "002", name: "NIGHT", bg: "#1E1E1C", ink: "#F4F4F0", accent: "#7FD8FF", line: "#3E3E3A", gray: "#A3A39C",
    mode: "single",
    pens: ["#F4F4F0", "#A3A39C", "#7FD8FF", "#FF6B6B", "#FFD466", "#B79CD6", "#6BE3A8"] }
];
function getPaletteId() {
  try { return localStorage.getItem("ij_palette") || "001"; } catch (e) { return "001"; }
}
function setPaletteId(id) {
  try { localStorage.setItem("ij_palette", id); } catch (e) {}
  applyPalette();
}
function getCustom() {
  try {
    var v = localStorage.getItem("ij_custom");
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}
function saveCustom(p) {
  try { localStorage.setItem("ij_custom", JSON.stringify(p)); return true; } catch (e) { return false; }
}
function defaultCustom() {
  return {
    id: "C", name: "MINE", bg: "#FFFFFF", ink: "#111111", accent: "#1D1DE0",
    line: "#E2E2DE", gray: "#9B9B95", mode: "single",
    multi: ["#C0261C", "#E8B33A", "#2E8B57", "#1D1DE0"],
    pens: ["#C0261C", "#1D1DE0", "#E8B33A", "#2E8B57", "#9B9B95", "#111111", "#E86FA8"]
  };
}
function allPalettes() {
  var list = PALETTES.slice();
  var c = getCustom();
  if (c) list.push(c);
  return list;
}
function currentPalette() {
  var id = getPaletteId();
  var list = allPalettes();
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return PALETTES[0];
}
function applyPalette() {
  var p = currentPalette();
  var s = document.documentElement.style;
  document.body.style.background = p.bg;
  document.body.style.color = p.ink;
  var css = document.getElementById("paletteStyle");
  if (!css) {
    css = document.createElement("style");
    css.id = "paletteStyle";
    document.head.appendChild(css);
  }
  css.textContent =
    ".bar{background:" + p.bg + ";border-color:" + p.line + "}" +
    ".tiny{color:" + p.gray + "}.tiny.ink{color:" + p.ink + "}.tiny.blue{color:" + p.accent + "}" +
    ".row,.paletteRow,.menuRow{border-color:" + p.line + "}" +
    ".num{color:" + p.gray + "}" +
    ".letter{color:" + p.ink + "}.letter.filled{color:" + p.accent + "}" +
    ".qlabel{color:" + p.ink + "}.qlabel.filled{color:" + p.accent + "}" +
    ".txt{color:" + p.ink + "}.val{color:" + p.ink + "}.val.empty{color:" + p.gray + "}" +
    ".primary{background:" + p.accent + ";color:" + p.bg + "}" +
    ".imgbtn{border-color:" + p.gray + ";color:" + p.gray + "}" +
    ".imgbtn.has{border-color:" + p.accent + ";color:" + p.accent + "}" +
    ".hintbtn{border-color:" + p.gray + ";color:" + p.gray + "}" +
    ".nowbtn{border-color:" + p.accent + ";color:" + p.accent + "}" +
    ".hint{color:" + p.gray + "}" +
    ".menuRow .label{color:" + p.ink + "}.menuRow .desc{color:" + p.gray + "}" +
    "#drawCanvas{border-color:" + p.ink + ";background:" + p.bg + "}" +
    ".motifCell{border-color:" + p.line + ";background:" + p.bg + "}" +
    "h1{color:" + p.ink + "}" +
    ".gear{color:" + p.gray + "}" +
    (p.mode === "multi" && p.multi ? p.multi.map(function (c, i) {
      return ".m" + i + "{color:" + c + " !important}";
    }).join("") : "");
}

// mode が "multi" のときだけ、色を A-Z の並びに循環させる
function multiClass(i) {
  var p = currentPalette();
  if (p.mode !== "multi" || !p.multi || !p.multi.length) return "";
  return " m" + (i % p.multi.length);
}

function seenIntro() {
  try { return localStorage.getItem("ij_intro_seen") === "1"; } catch (e) { return false; }
}
function markIntroSeen() {
  try { localStorage.setItem("ij_intro_seen", "1"); } catch (e) {}
}
function lastBackup() {
  try { return localStorage.getItem("ij_last_backup") || ""; } catch (e) { return ""; }
}
function markBackup() {
  try { localStorage.setItem("ij_last_backup", todayKey()); } catch (e) {}
}
// 最後のバックアップから何日経ったか（一度もなければ null）
function daysSinceBackup() {
  var d = lastBackup();
  if (!d) return null;
  var then = new Date(d + "T00:00:00");
  var now = new Date(todayKey() + "T00:00:00");
  return Math.round((now - then) / 86400000);
}

function getMotifs() {
  try { var v = localStorage.getItem("ij_motifs"); return v ? JSON.parse(v) : []; } catch (e) { return []; }
}
function saveMotifs(list) {
  try { localStorage.setItem("ij_motifs", JSON.stringify(list)); return true; } catch (e) { return false; }
}

/* ---------- 言語 ---------- */
function getLang() {
  try { return localStorage.getItem("ij_lang") || ""; } catch (e) { return ""; }
}
function setLang(l) {
  try { localStorage.setItem("ij_lang", l); } catch (e) {}
}
function isEN() { return getLang() === "en"; }
// t("日本語", "English")
function t(ja, en) { return isEN() ? en : ja; }

var EASY_QUESTIONS_JA = [
  { id: "when", label: "WHEN", hint: "朝、昼、夜——今はだいたい何時ごろ？" },
  { id: "where", label: "WHERE", hint: "部屋、電車の中、カフェ、外の空気——今どこにいる？" },
  { id: "who", label: "WITH WHO", hint: "ひとり、誰かと一緒——今そばにいるのは誰？" },
  { id: "what", label: "DOING", hint: "座ってる、歩いてる、作業中——今のからだの状態は？" },
  { id: "feel", label: "THINKING", hint: "どんな気分？　何か食べたいものある？　頭に浮かんでること" },
  { id: "next", label: "UP NEXT", hint: "次の予定、まだ決めてないこと、やりたいこと" }
];
var EASY_QUESTIONS_EN = [
  { id: "when", label: "WHEN", hint: "Morning, noon, night — roughly what time is it now?" },
  { id: "where", label: "WHERE", hint: "A room, a train, a cafe, outside — where are you?" },
  { id: "who", label: "WITH WHO", hint: "Alone, or with someone — who is near you now?" },
  { id: "what", label: "DOING", hint: "Sitting, walking, working — what is your body doing?" },
  { id: "feel", label: "THINKING", hint: "How do you feel? Craving anything? What is on your mind?" },
  { id: "next", label: "UP NEXT", hint: "What comes next, decided or not." }
];

var EASY_QUESTIONS = EASY_QUESTIONS_JA;
function syncLang() {
  EASY_QUESTIONS = isEN() ? EASY_QUESTIONS_EN : EASY_QUESTIONS_JA;
}

function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function formatDateLabel(key) {
  var p = key.split("-");
  var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return months[Number(p[1]) - 1] + " " + p[2] + ", " + p[0];
}
function formatNowStamp() {
  var d = new Date();
  return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0")
    + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- storage (GAS + localStorageキャッシュ) ---------- */
// deviceId: この端末を識別するID。記録はスプレッドシート側にこのIDで' + t("保存", "Save") + 'される。
function lsGet(date) {
  try { var v = localStorage.getItem("ij_entry_" + date); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function lsSet(date, entry) {
  try { localStorage.setItem("ij_entry_" + date, JSON.stringify(entry)); return true; } catch (e) { return false; }
}
function lsDelete(date) {
  try { localStorage.removeItem("ij_entry_" + date); } catch (e) {}
  ALPHABET.forEach(function (l) { removePhoto(date, l); });
}
function lsDates() {
  var dates = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("ij_entry_") === 0) dates.push(k.slice(9));
    }
  } catch (e) {}
  dates.sort(); dates.reverse();
  return dates;
}
function getPhoto(date, letter) {
  try { return localStorage.getItem("ij_photo_" + date + "_" + letter); } catch (e) { return null; }
}
function setPhoto(date, letter, dataUrl) {
  try { localStorage.setItem("ij_photo_" + date + "_" + letter, dataUrl); return true; } catch (e) { return false; }
}
function removePhoto(date, letter) {
  try { localStorage.removeItem("ij_photo_" + date + "_" + letter); } catch (e) {}
}

// すべての記録を1つのテキストに' + t("書き出す", "Export") + '（バックアップ／ZINE原稿用）
function exportAll() {
  var dates = lsDates();
  var out = ["INDEX JOURNAL — EXPORT " + formatNowStamp(), "記録数：" + dates.length, ""];
  dates.slice().reverse().forEach(function (d) {
    var e = lsGet(d);
    if (!e) return;
    out.push("────────────────");
    out.push(buildEntryText(d, e));
    out.push("");
  });
  return out.join("\n");
}

var state = {
  view: "cover",
  date: todayKey(),
  letters: {},
  answers: {},
  timerId: null,
  secondsLeft: 0,
  saveTimer: null,
  pendingDelete: null
};
ALPHABET.forEach(function (l) { state.letters[l] = ""; });
EASY_QUESTIONS.forEach(function (q) { state.answers[q.id] = ""; });

function applyEntry(e) {
  e = e || {};
  ALPHABET.forEach(function (l) {
    state.letters[l] = (e.deep && e.deep.letters && e.deep.letters[l]) || "";
  });
  EASY_QUESTIONS.forEach(function (q) {
    state.answers[q.id] = (e.easy && e.easy.answers && e.easy.answers[q.id]) || "";
  });
}
function loadDate(date, done) {
  applyEntry(lsGet(date));
  if (done) done();
}
function saveNow() {
  var entry = {
    deep: { letters: state.letters },
    easy: { answers: state.answers },
    updatedAt: new Date().toISOString()
  };
  var ok = lsSet(state.date, entry);
  setNote(ok ? "SAVED" : t("SAVE FAILED（容量不足）", "SAVE FAILED (out of space)"));
  return ok;
}
function setNote(msg) {
  var el = document.getElementById("savenote");
  if (el) el.textContent = msg;
}
function scheduleSave() {
  if (state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(saveNow, 400);
}
function stopTimer() {
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}
function startTimer(seconds) {
  stopTimer();
  state.secondsLeft = seconds;
  updateTimerLabel();
  state.timerId = setInterval(function () {
    if (state.secondsLeft > 0) state.secondsLeft--;
    updateTimerLabel();
    if (state.secondsLeft <= 0) stopTimer();
  }, 1000);
}
function updateTimerLabel() {
  var el = document.getElementById("timer");
  if (!el) return;
  if (state.secondsLeft <= 0) { el.textContent = "TIME'S UP"; el.className = "tiny blue"; return; }
  var mm = String(Math.floor(state.secondsLeft / 60)).padStart(2, "0");
  var ss = String(state.secondsLeft % 60).padStart(2, "0");
  el.textContent = mm + ":" + ss;
}

function resizeImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxDim = 600;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* ---------- share ---------- */
function buildEntryText(dateKey, entry) {
  var lines = ["INDEX JOURNAL — " + formatDateLabel(dateKey)];
  var easy = entry.easy && entry.easy.answers ? entry.easy.answers : {};
  var deep = entry.deep && entry.deep.letters ? entry.deep.letters : {};
  var hasEasy = EASY_QUESTIONS.some(function (q) { return (easy[q.id] || "").trim(); });
  var hasDeep = ALPHABET.some(function (l) { return (deep[l] || "").trim(); });
  if (hasEasy) {
    lines.push(""); lines.push("EASY");
    EASY_QUESTIONS.forEach(function (q) {
      var v = (easy[q.id] || "").trim();
      if (v) lines.push(q.label + "：" + v);
    });
  }
  if (hasDeep) {
    lines.push(""); lines.push("DEEP");
    ALPHABET.forEach(function (l) {
      var v = (deep[l] || "").trim();
      if (v) lines.push(l + "｜" + v);
    });
  }
  return lines.join("\n");
}
function buildICS(dateKey, text) {
  var dt = dateKey.replace(/-/g, "");
  var stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  var uid = dt + "-" + Math.random().toString(36).slice(2) + "@index-journal";
  var e = text.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//INDEX JOURNAL//JP","BEGIN:VEVENT",
    "UID:" + uid, "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + dt, "DTEND;VALUE=DATE:" + dt,
    "SUMMARY:INDEX JOURNAL", "DESCRIPTION:" + e, "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function downloadICS(dateKey, text) {
  var blob = new Blob([buildICS(dateKey, text)], { type: "text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "index-journal-" + dateKey + ".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------- render ---------- */
var root = document.getElementById("root");

function backupNoticeHtml() {
  var p = currentPalette();
  var n = daysSinceBackup();
  var count = lsDates().length;
  if (count === 0) return "";
  var msg = null;
  if (n === null) msg = t("まだ一度も書き出していません", "Never exported yet");
  else if (n >= 7) msg = t("最後の書き出しから " + n + " 日", n + " days since last export");
  if (!msg) return "";
  return '<button id="backupNotice" style="width:100%;text-align:left;margin-top:14px;padding:12px 14px;' +
    'border:1px solid ' + p.accent + ';color:' + p.accent + ';font-size:12px;letter-spacing:0.06em">' +
    '⚠ ' + msg + '　—　BACKUP →</button>';
}

function renderCover() {
  stopTimer();
  state.view = "cover";
  var isToday = state.date === todayKey();
  root.innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:2">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:24px 24px 16px;border-bottom:1px solid #DEDEDA;position:relative;z-index:2">' +
      '<button id="settingsBtn" class="gear">≡</button><span></span></div>' +
    '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px">' +
      '<h1 style="font-size:clamp(3.5rem,14vw,9rem);letter-spacing:-0.03em;line-height:0.85;font-weight:700">index<br>journal</h1></div>' +
    '<div style="padding:0 24px 40px;border-top:1px solid #DEDEDA">' +
      '<div style="padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<span class="tiny">' + (isToday ? "TODAY" : "BACKFILL") + '</span>' +
        '<input type="date" id="datepick" value="' + state.date + '" max="' + todayKey() + '" style="font-size:12px;padding:4px 8px;border:1px solid #DEDEDA;color:#111"></div>' +

/* ---------- 降ってくるモチーフ ---------- */
var fallTimer = null;
function stopFalling() {
  if (fallTimer) { clearInterval(fallTimer); fallTimer = null; }
  var layer = document.getElementById("fallLayer");
  if (layer) layer.remove();
}
function startFalling() {
  stopFalling();
  var motifs = getMotifs();
  if (!motifs.length) return;
  var layer = document.createElement("div");
  layer.id = "fallLayer";
  document.body.appendChild(layer);
  function drop() {
    if (!document.getElementById("fallLayer")) return;
    var src = motifs[Math.floor(Math.random() * motifs.length)];
    var img = document.createElement("img");
    img.className = "fallItem";
    img.src = src;
    var size = 28 + Math.random() * 36;
    img.style.width = size + "px";
    img.style.left = (Math.random() * 92) + "vw";
    img.style.opacity = 0.55 + Math.random() * 0.45;
    var dur = 6000 + Math.random() * 5000;
    var spin = (Math.random() * 720 - 360);
    layer.appendChild(img);
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var pr = (ts - start) / dur;
      if (pr >= 1) { img.remove(); return; }
      var y = pr * (window.innerHeight + 160);
      var x = Math.sin(pr * Math.PI * 2) * 18;
      img.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (spin * pr) + "deg)";
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  for (var i = 0; i < 3; i++) setTimeout(drop, i * 700);
  fallTimer = setInterval(drop, 1400);
}

  if (navigator.share) {
    navigator.share({ title: "index journal", text: msg, url: url }).catch(function (err) {
      if (err && err.name === "AbortError") return;

      alert(t("リンクをコピーしました。", "Link copied."));
    }).catch(function () { alert(payload); });
  } else {
    alert(payload);
  }
}

  document.getElementById("backBtn").addEventListener("click", renderDesign);

  var mode = c.mode === "multi" ? "multi" : "single";
  function collect() {
    var out = {
      id: "C",
      name: (document.getElementById("cName").value || "MINE").slice(0, 12),
      bg: document.querySelector('[data-key="bg"]').value,
      ink: document.querySelector('[data-key="ink"]').value,
      mode: mode,
      multi: []
    };
    if (mode === "multi") {
      for (var i = 0; i < 4; i++) {
        var el = document.querySelector('#multiFields [data-key="multi' + i + '"]');
        if (el) out.multi.push(el.value);
      }
    } else {
      var s = document.querySelector('#singleField [data-key="multi0"]');
      out.multi = [s ? s.value : out.ink];
    }
    out.accent = out.multi[0] || out.ink;
    out.line = mix(out.bg, out.ink, 0.15);
    out.gray = mix(out.bg, out.ink, 0.45);
    out.pens = [];
    for (var j = 0; j < 7; j++) {
      var pe = document.querySelector('[data-pen="' + j + '"]');
      if (pe) out.pens.push(pe.value);
    }
    return out;
  }
  function mix(a, b, r) {
    function n(h, i) { return parseInt(h.substr(1 + i * 2, 2), 16); }
    var o = "#";
    for (var i = 0; i < 3; i++) {
      var v = Math.round(n(a, i) * (1 - r) + n(b, i) * r);
      o += ("0" + v.toString(16)).slice(-2);
    }
    return o;
  }

      mb.style.cssText = "flex:1;font-size:12px;" + (mul ? "background:" + p.accent + ";color:" + p.bg : "border:1px solid " + p.line + ";color:" + p.gray);
      sb.className = "sharebtn"; mb.className = "sharebtn";
      preview();
    });
  });
  preview();

  document.getElementById("cSave").addEventListener("click", function () {
    var theme = collect();
    if (!saveCustom(theme)) { alert(t("保存できませんでした。", "Could not save.")); return; }
    setPaletteId("C");
    renderDesign();
  });

    try { localStorage.removeItem("ij_custom"); } catch (e) {}
    if (getPaletteId() === "C") setPaletteId("001");
    renderDesign();
  });
}

function renderDraw() {
  stopTimer(); stopFalling();
  state.view = "draw";
  var p = currentPalette();
  var colors = p.pens || [p.ink, p.accent, "#C0261C", "#E8B33A", "#3AA76D", "#D66BA0", p.gray];
  var swatches = colors.map(function (c, i) {
    return '<button class="sw" data-color="' + c + '" style="width:28px;height:28px;background:' + c + ';border:' + (i === 0 ? '2px solid ' + p.accent : '1px solid ' + p.line) + '"></button>';
  }).join("");
  root.innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column">' +
    '<div class="bar">' +
      '<button id="backBtn" class="tiny ink" style="letter-spacing:0.15em">← BACK</button>' +
      '<span class="tiny">DRAW</span><span class="tiny">—</span></div>' +
    '<div class="wrap" style="flex:1;padding-top:16px;padding-bottom:48px">' +
      '<canvas id="drawCanvas" width="320" height="320"></canvas>' +
      '<div style="display:flex;gap:8px;align-items:center;padding-top:16px;flex-wrap:wrap">' + swatches + '</div>' +
      '<div style="display:flex;gap:12px;align-items:center;padding-top:16px">' +
        '<span class="tiny">' + t("太さ", "SIZE") + '</span>' +
        '<input type="range" id="penSize" min="2" max="28" value="8" style="flex:1">' +
      '</div>' +
      '<div style="display:flex;gap:8px;padding-top:20px;flex-wrap:wrap">' +
        '<button id="saveMotif" class="primary">' + t("保存", "Save") + '</button>' +
        '<button id="clearCanvas" class="sharebtn" style="border:1px solid ' + p.gray + ';color:' + p.gray + '">' + t("消す", "Clear") + '</button>' +
      '</div>' +
      '<p class="tiny" style="padding-top:16px;line-height:1.8">' + t("指でなぞって描いてください。<br>保存すると、表紙にゆっくり降ってきます。", "Draw with your finger.<br>Once saved, it will drift down on the cover.") + '</p>' +
    '</div></div>';
  document.getElementById("backBtn").addEventListener("click", renderDesign);

  var canvas = document.getElementById("drawCanvas");
  var ctx = canvas.getContext("2d");
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  var color = colors[0];
  var size = 8;
  var drawing = false;

  function pos(ev) {
    var r = canvas.getBoundingClientRect();
    var touch = ev.touches ? ev.touches[0] : ev;
    return {
      x: (touch.clientX - r.left) * (canvas.width / r.width),
      y: (touch.clientY - r.top) * (canvas.height / r.height)
    };
  }
  function down(ev) { ev.preventDefault(); drawing = true; var q = pos(ev); ctx.beginPath(); ctx.moveTo(q.x, q.y); }
  function move(ev) {
    if (!drawing) return;
    ev.preventDefault();
    var q = pos(ev);
    ctx.strokeStyle = color; ctx.lineWidth = size;
    ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(q.x, q.y);
  }
  function up() { drawing = false; }
  canvas.addEventListener("touchstart", down, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", up);
  canvas.addEventListener("mousedown", down);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", up);
  canvas.addEventListener("mouseleave", up);

  Array.prototype.forEach.call(document.querySelectorAll("[data-color]"), function (b) {
    b.addEventListener("click", function () {
      color = b.getAttribute("data-color");
      Array.prototype.forEach.call(document.querySelectorAll("[data-color]"), function (x) {
        x.style.border = "1px solid " + p.line;
      });
      b.style.border = "2px solid " + p.accent;
    });
  });
  document.getElementById("penSize").addEventListener("input", function (e) { size = Number(e.target.value); });
  document.getElementById("clearCanvas").addEventListener("click", function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
  document.getElementById("saveMotif").addEventListener("click", function () {
    var data = canvas.toDataURL("image/png");
    var list = getMotifs();
    if (list.length >= 12) { alert("モチーフは12個までです。"); return; }
    list.push(data);
    if (!saveMotifs(list)) { alert(t("保存容量が足りません。", "Not enough space.")); return; }
    renderDesign();
  });
}

function copyText(text, noteId) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      document.getElementById(noteId).textContent = "コピーしました。メモアプリなどに貼り付けてください。";
    }).catch(function () {
      document.getElementById(noteId).textContent = "下のテキストを長押しでコピーしてください。";
    });
  } else {
    document.getElementById(noteId).textContent = "下のテキストを長押しでコピーしてください。";
  }
}

    count = 0;

      if (el) el.className = "letter" + (filled ? " filled" : "") + multiClass(ALPHABET.indexOf(l));

    return '<div class="row rowline" style="padding:16px 0">' +
      '<span class="num">' + String(i).padStart(2, "0") + '</span>' +
      '<button data-open="' + dateKey + '" style="flex:1;text-align:left;font-size:15px;font-weight:700">' + formatDateLabel(dateKey) + '</button>' +
      (easyCount > 0 ? '<span style="font-size:11px;color:' + BLUE + '">EASY ' + easyCount + '/' + EASY_QUESTIONS.length + '</span>' : '') +
      (deepCount > 0 ? '<span style="font-size:11px;color:' + BLUE + '">DEEP ' + deepCount + '/26</span>' : '') +
      '<button class="rm" data-del="' + dateKey + '">DEL</button>' +
    '</div>';
  }).join("");
  root.innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:2">' +
    '<div class="bar">' +
      '<button id="backBtn" class="tiny ink" style="letter-spacing:0.15em">← BACK</button>' +
      '<span class="tiny">ARCHIVE</span>' +
      '<span class="tiny">' + String(items.length).padStart(2, "0") + '</span></div>' +
    '<div class="wrap" style="flex:1;padding-top:16px;padding-bottom:40px">' +
      (offline ? '<p style="font-size:12px;color:#C0261C;padding-bottom:12px">' + t("通信できませんでした。電波のいい場所で開き直してください。", "Could not load.") + '</p>' : '') +
      (items.length === 0 ? '<p style="font-size:14px;color:#9B9B95;text-align:center;padding:64px 0">NO RECORDS YET</p>' : rows) +
    '</div></div>';
  document.getElementById("backBtn").addEventListener("click", renderSettings);
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function (b) {
    b.addEventListener("click", function () { renderDetail(b.getAttribute("data-open")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
    b.addEventListener("click", function () {
      var d = b.getAttribute("data-del");
      if (state.pendingDelete === d) {
        lsDelete(d);
        renderArchive();
      } else {
        state.pendingDelete = d;
        b.textContent = "SURE?";
        b.style.fontWeight = "700";
      }
    });
  });
  startFalling();
}

function renderDetail(dateKey) {
  state.view = "detail";
  drawDetail(dateKey, lsGet(dateKey) || {});
}

function drawDetail(dateKey, e) {
  e = e || {};
  var deep = e.deep && e.deep.letters ? e.deep.letters : {};
  var easy = e.easy && e.easy.answers ? e.easy.answers : {};
  var hasEasy = EASY_QUESTIONS.some(function (q) { return (easy[q.id] || "").trim(); });
  var hasDeep = ALPHABET.some(function (l) { return (deep[l] || "").trim(); });
  var html = '';
  if (hasEasy) {
    html += '<p class="tiny" style="padding-top:24px;padding-bottom:8px">EASY</p>';
    EASY_QUESTIONS.forEach(function (q, i) {
      var v = (easy[q.id] || "").trim();
      html += '<div class="row rowline">' +
        '<span class="num">' + String(i).padStart(2, "0") + '</span>' +
        '<span class="qlabel' + (v ? ' filled' : '') + '">' + q.label + '</span>' +
        '<span class="val' + (v ? '' : ' empty') + '">' + (v ? esc(v) : "—") + '</span></div>';
    });
  }
  if (hasDeep) {
    html += '<p class="tiny" style="padding-top:32px;padding-bottom:8px">DEEP</p>';
    ALPHABET.forEach(function (l, i) {
      var v = (deep[l] || "").trim();
      var photo = getPhoto(dateKey, l);
      html += '<div class="row">' +
        '<div class="rowline">' +
        '<span class="num">' + String(i).padStart(2, "0") + '</span>' +
        '<span class="letter' + (v ? ' filled' : '') + multiClass(i) + '">' + l + '</span>' +
        '<span class="val' + (v ? '' : ' empty') + '">' + (v ? esc(v) : "—") + '</span></div>' +
        (photo ? '<img class="bigimg" src="' + photo + '">' : '') +
        '</div>';
    });
  }
  if (!hasEasy && !hasDeep) {
    html += '<p style="font-size:14px;color:#9B9B95;text-align:center;padding:64px 0">NO DATA</p>';
  } else {
    html += '<div style="padding-top:24px;border-top:1px solid #DEDEDA;margin-top:32px">' +
      '<p class="tiny" style="padding-bottom:12px">SHARE</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button id="shareBtn" class="sharebtn" style="background:#111;color:#FFF">SHARE</button>' +
        '<button id="calBtn" class="sharebtn" style="border:1px solid ' + BLUE + ';color:' + BLUE + '">+ CALENDAR</button></div>' +
      '<p id="shareNote" style="font-size:12px;color:' + BLUE + ';padding-top:12px;line-height:1.7"></p>' +
      '<textarea id="shareText" readonly rows="10" style="display:none;width:100%;margin-top:12px;padding:12px;font-size:13px;border:1px solid #DEDEDA;background:#FAFAF8"></textarea>' +
    '</div>';
  }
  root.innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:2">' +
    '<div class="bar">' +
      '<button id="backBtn" class="tiny ink" style="letter-spacing:0.15em">← ARCHIVE</button>' +
      '<span class="tiny">' + formatDateLabel(dateKey) + '</span><span></span></div>' +
    '<div class="wrap" style="flex:1;padding-bottom:40px">' + html + '</div></div>';
  document.getElementById("backBtn").addEventListener("click", renderArchive);
  var shareBtn = document.getElementById("shareBtn");
  if (shareBtn) {
    var text = buildEntryText(dateKey, e);
    shareBtn.addEventListener("click", function () {
      if (navigator.share) {
        navigator.share({ text: text, title: "INDEX JOURNAL" }).catch(function (err) {
          if (err && err.name === "AbortError") return;
          copyFallback(text);
        });
      } else {
        copyFallback(text);
      }
    });
    document.getElementById("calBtn").addEventListener("click", function () {
      try {
        downloadICS(dateKey, text);
        document.getElementById("shareNote").textContent = "カレンダーファイル（.ics）を書き出しました。開くとカレンダーに追加できます。";
      } catch (err) {
        showShareText(text, "書き出しに失敗しました。下のテキストをコピーしてください。");
      }
    });
  }
  startFalling();
}
function copyFallback(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      document.getElementById("shareNote").textContent = "テキストをコピーしました。LINEやXなどに貼り付けてください。";
    }).catch(function () { showShareText(text, "下のテキストを長押しでコピーしてください。"); });
  } else {
    showShareText(text, "下のテキストを長押しでコピーしてください。");
  }
}
function showShareText(text, note) {
  var ta = document.getElementById("shareText");
  ta.value = text;
  ta.style.display = "block";
  document.getElementById("shareNote").textContent = note;
}

applyPalette();
syncLang();
if (!getLang()) { renderLangPick(); } else { renderCover(); }
</script>
