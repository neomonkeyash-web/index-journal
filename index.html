<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>INDEX JOURNAL</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  input, textarea, button, label { font-family: inherit; }
  input::placeholder { color: #C7C7C2; }
  input:focus, textarea:focus { outline: none; }
  button { background: none; border: none; cursor: pointer; }
  .hiddenfile { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const BLUE = "#1D1DE0";
const INK = "#111111";
const GRAY = "#9B9B95";
const LINE = "#DEDEDA";
const RED = "#C0261C";

const EASY_QUESTIONS = [
  { id: "when", label: "WHEN", hint: "朝、昼、夜——今はだいたい何時ごろ？" },
  { id: "where", label: "WHERE", hint: "部屋、電車の中、カフェ、外の空気——今どこにいる？" },
  { id: "who", label: "WITH WHO", hint: "ひとり、誰かと一緒——今そばにいるのは誰？" },
  { id: "what", label: "DOING", hint: "座ってる、歩いてる、作業中——今のからだの状態は？" },
  { id: "feel", label: "THINKING", hint: "どんな気分？　何か食べたいものある？　頭に浮かんでること" },
  { id: "next", label: "UP NEXT", hint: "次の予定、まだ決めてないこと、やりたいこと" },
];

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatDateLabel(key) {
  const parts = key.split("-").map(Number);
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return months[parts[1] - 1] + " " + String(parts[2]).padStart(2, "0") + ", " + parts[0];
}

function formatNowStamp() {
  const d = new Date();
  return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0")
    + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function emptyLetters() { const o = {}; ALPHABET.forEach(l => o[l] = ""); return o; }
function emptyAnswers() { const o = {}; EASY_QUESTIONS.forEach(q => o[q.id] = ""); return o; }

/* ---------- localStorage 保存 ---------- */

function lsGetEntry(date) {
  try {
    const v = localStorage.getItem("ij_entry_" + date);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

function lsSetEntry(date, entry) {
  try {
    localStorage.setItem("ij_entry_" + date, JSON.stringify(entry));
    return true;
  } catch (e) { return false; }
}

function lsDeleteEntry(date) {
  try { localStorage.removeItem("ij_entry_" + date); } catch (e) {}
  ALPHABET.forEach(l => { try { localStorage.removeItem("ij_photo_" + date + "_" + l); } catch (e) {} });
}

function lsListDates() {
  const dates = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("ij_entry_")) dates.push(k.slice(9));
    }
  } catch (e) {}
  dates.sort().reverse();
  return dates;
}

function lsGetPhoto(date, letter) {
  try { return localStorage.getItem("ij_photo_" + date + "_" + letter); } catch (e) { return null; }
}

function lsSetPhoto(date, letter, dataUrl) {
  try {
    localStorage.setItem("ij_photo_" + date + "_" + letter, dataUrl);
    return true;
  } catch (e) { return false; } // 容量オーバーなど
}

function lsRemovePhoto(date, letter) {
  try { localStorage.removeItem("ij_photo_" + date + "_" + letter); } catch (e) {}
}

function lsLoadPhotos(date) {
  const o = {};
  ALPHABET.forEach(l => {
    const v = lsGetPhoto(date, l);
    if (v) o[l] = v;
  });
  return o;
}

/* ---------- 写真の縮小 ---------- */

function resizeImage(file, maxDim, quality) {
  maxDim = maxDim || 600;
  quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("image load failed"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("file read failed"));
    reader.readAsDataURL(file);
  });
}

/* ---------- シェア ---------- */

function buildEntryText(dateKey, data) {
  const lines = ["INDEX JOURNAL — " + formatDateLabel(dateKey)];
  if (data.hasEasy) {
    lines.push(""); lines.push("EASY");
    EASY_QUESTIONS.forEach(q => {
      const v = data.answers[q.id];
      if (v && v.trim()) lines.push(q.label + "：" + v.trim());
    });
  }
  if (data.hasDeep) {
    lines.push(""); lines.push("DEEP");
    ALPHABET.forEach(l => {
      const v = data.letters[l];
      if (v && v.trim()) lines.push(l + "｜" + v.trim());
    });
  }
  return lines.join("\n");
}

function buildICS(dateKey, text) {
  const dt = dateKey.replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const uid = dt + "-" + Math.random().toString(36).slice(2) + "@index-journal";
  const esc = s => s.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//INDEX JOURNAL//JP","BEGIN:VEVENT",
    "UID:" + uid, "DTSTAMP:" + stamp,
    "DTSTART;VALUE=DATE:" + dt, "DTEND;VALUE=DATE:" + dt,
    "SUMMARY:INDEX JOURNAL", "DESCRIPTION:" + esc(text),
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}

function downloadICS(dateKey, text) {
  const blob = new Blob([buildICS(dateKey, text)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index-journal-" + dateKey + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- タイマー ---------- */

function useCountdown(totalSeconds, active) {
  const [secondsLeft, setSecondsLeft] = useState(totalSeconds);
  useEffect(() => { setSecondsLeft(totalSeconds); }, [totalSeconds, active]);
  useEffect(() => {
    if (!active || secondsLeft <= 0) return;
    const t = setInterval(() => setSecondsLeft(s => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [active, secondsLeft > 0]);
  return {
    label: String(Math.floor(secondsLeft / 60)).padStart(2, "0") + ":" + String(secondsLeft % 60).padStart(2, "0"),
    isDone: secondsLeft <= 0,
  };
}

/* ---------- スタイル ---------- */

const wrap = { maxWidth: 680, width: "100%", margin: "0 auto", padding: "0 24px" };
const barStyle = {
  display: "flex", alignItems: "center", justifyContent: "space-between",
  padding: "16px 24px", borderBottom: "1px solid " + LINE,
  position: "sticky", top: 0, background: "#FFF", zIndex: 10,
};
const tinyText = { fontSize: 11, letterSpacing: "0.15em", color: GRAY };
const linkBtn = { fontSize: 11, letterSpacing: "0.15em", color: INK };

/* ---------- メイン ---------- */

function IndexJournal() {
  const [view, setView] = useState("cover");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [letters, setLetters] = useState(emptyLetters());
  const [answers, setAnswers] = useState(emptyAnswers());
  const [photos, setPhotos] = useState({});
  const [archiveList, setArchiveList] = useState([]);
  const [detailKey, setDetailKey] = useState(null);
  const [detailData, setDetailData] = useState(null);
  const [detailPhotos, setDetailPhotos] = useState({});
  const [error, setError] = useState(null);
  const saveTimer = useRef(null);

  const loadEntry = useCallback(() => {
    const entry = lsGetEntry(selectedDate);
    setLetters(Object.assign(emptyLetters(), entry && entry.deep ? entry.deep.letters : {}));
    setAnswers(Object.assign(emptyAnswers(), entry && entry.easy ? entry.easy.answers : {}));
    setPhotos(lsLoadPhotos(selectedDate));
  }, [selectedDate]);

  useEffect(() => { loadEntry(); }, [loadEntry]);

  const saveNow = useCallback((nextLetters, nextAnswers) => {
    const entry = {
      deep: { letters: nextLetters !== undefined ? nextLetters : letters },
      easy: { answers: nextAnswers !== undefined ? nextAnswers : answers },
      updatedAt: new Date().toISOString(),
    };
    const ok = lsSetEntry(selectedDate, entry);
    setError(ok ? null : "SAVE FAILED（容量不足の可能性）");
    return ok;
  }, [selectedDate, letters, answers]);

  const persist = useCallback((nextLetters, nextAnswers) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => saveNow(nextLetters, nextAnswers), 400);
  }, [saveNow]);

  const finishAndArchive = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (!saveNow()) return;
    loadArchive();
  }, [saveNow]);

  const handleLetterChange = (letter, value) => {
    const next = Object.assign({}, letters); next[letter] = value;
    setLetters(next); persist(next, undefined);
  };

  const handleAnswerChange = (id, value) => {
    const next = Object.assign({}, answers); next[id] = value;
    setAnswers(next); persist(undefined, next);
  };

  const handlePhotoSelect = async (letter, file) => {
    if (!file) return;
    try {
      const dataUrl = await resizeImage(file);
      const ok = lsSetPhoto(selectedDate, letter, dataUrl);
      if (!ok) { setError("写真の保存容量が足りません（古い写真を削除してください）"); return; }
      setPhotos(prev => Object.assign({}, prev, { [letter]: dataUrl }));
      setError(null);
    } catch (e) { setError("PHOTO FAILED"); }
  };

  const handlePhotoRemove = (letter) => {
    lsRemovePhoto(selectedDate, letter);
    setPhotos(prev => { const n = Object.assign({}, prev); delete n[letter]; return n; });
  };

  const deepFilledCount = ALPHABET.filter(l => letters[l].trim().length > 0).length;
  const easyFilledCount = EASY_QUESTIONS.filter(q => answers[q.id].trim().length > 0).length;

  const loadArchive = () => {
    const items = lsListDates().map(dateKey => {
      const e = lsGetEntry(dateKey) || {};
      const deepCount = e.deep ? ALPHABET.filter(l => (e.deep.letters[l] || "").trim()).length : 0;
      const easyCount = e.easy ? EASY_QUESTIONS.filter(q => (e.easy.answers[q.id] || "").trim()).length : 0;
      return { dateKey, deepCount, easyCount };
    });
    setArchiveList(items);
    setView("archive");
  };

  const openDetail = (dateKey) => {
    const e = lsGetEntry(dateKey);
    if (!e) return;
    const deep = e.deep || null;
    const easy = e.easy || null;
    setDetailData({
      letters: Object.assign(emptyLetters(), deep ? deep.letters : {}),
      answers: Object.assign(emptyAnswers(), easy ? easy.answers : {}),
      hasDeep: !!deep && Object.values(deep.letters || {}).some(v => v && v.trim()),
      hasEasy: !!easy && Object.values(easy.answers || {}).some(v => v && v.trim()),
    });
    setDetailKey(dateKey);
    setDetailPhotos(lsLoadPhotos(dateKey));
    setView("detail");
  };

  const deleteEntry = (dateKey, ev) => {
    ev.stopPropagation();
    lsDeleteEntry(dateKey);
    setArchiveList(prev => prev.filter(i => i.dateKey !== dateKey));
  };

  return (
    <div style={{ minHeight: "100vh" }}>
      {view === "cover" && (
        <CoverView
          selectedDate={selectedDate}
          onChangeDate={setSelectedDate}
          onStartEasy={() => { loadEntry(); setView("easy"); }}
          onStartDeep={() => { loadEntry(); setView("deep"); }}
          onArchive={loadArchive}
        />
      )}

      {view === "deep" && (
        <DeepEntryView
          dateKey={selectedDate} letters={letters} photos={photos}
          onChange={handleLetterChange} onPhotoSelect={handlePhotoSelect} onPhotoRemove={handlePhotoRemove}
          filledCount={deepFilledCount} error={error}
          onBack={() => setView("cover")} onFinish={finishAndArchive}
        />
      )}

      {view === "easy" && (
        <EasyEntryView
          dateKey={selectedDate} answers={answers}
          onChange={handleAnswerChange}
          filledCount={easyFilledCount} error={error}
          onBack={() => setView("cover")} onFinish={finishAndArchive}
        />
      )}

      {view === "archive" && (
        <ArchiveView items={archiveList} onBack={() => setView("cover")} onOpen={openDetail} onDelete={deleteEntry} />
      )}

      {view === "detail" && detailData && (
        <DetailView dateKey={detailKey} data={detailData} photos={detailPhotos} onBack={() => setView("archive")} />
      )}
    </div>
  );
}

function TimerBar({ label, isDone }) {
  return (
    <span style={Object.assign({}, tinyText, { color: isDone ? BLUE : GRAY, fontVariantNumeric: "tabular-nums" })}>
      {isDone ? "TIME'S UP" : label}
    </span>
  );
}

function CoverView({ selectedDate, onChangeDate, onStartEasy, onStartDeep, onArchive }) {
  const isToday = selectedDate === todayKey();
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", padding: "24px 24px 16px", borderBottom: "1px solid " + LINE }}>
        <span style={tinyText}>TWO WAYS IN</span>
        <span style={tinyText}>WEB 001</span>
      </div>

      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 24px" }}>
        <h1 style={{ color: INK, fontSize: "clamp(3.5rem, 14vw, 9rem)", letterSpacing: "-0.03em", lineHeight: 0.85, fontWeight: 700 }}>
          index<br />journal
        </h1>
      </div>

      <div style={{ padding: "0 24px 40px", borderTop: "1px solid " + LINE }}>
        <div style={{ paddingTop: 20, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <span style={tinyText}>{isToday ? "TODAY" : "BACKFILL"}</span>
          <input
            type="date" value={selectedDate} max={todayKey()}
            onChange={e => e.target.value && onChangeDate(e.target.value)}
            style={{ fontSize: 12, padding: "4px 8px", background: "transparent", border: "1px solid " + LINE, color: INK }}
          />
        </div>

        <div style={{ paddingTop: 16, display: "flex", gap: 12, flexWrap: "wrap" }}>
          <button onClick={onStartEasy}
            style={{ flex: 1, minWidth: 140, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 24px", border: "1px solid " + INK, color: INK }}>
            <span style={{ fontSize: 14, letterSpacing: "0.15em", fontWeight: 700 }}>EASY</span>
            <span style={{ fontSize: 11, color: GRAY }}>5 MIN · 6問</span>
          </button>
          <button onClick={onStartDeep}
            style={{ flex: 1, minWidth: 140, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 24px", background: INK, color: "#FFF" }}>
            <span style={{ fontSize: 14, letterSpacing: "0.15em", fontWeight: 700 }}>DEEP</span>
            <span style={{ fontSize: 11, color: "#C7C7C2" }}>10 MIN · A—Z</span>
          </button>
        </div>

        <div style={{ paddingTop: 20 }}>
          <button onClick={onArchive} style={linkBtn}>ARCHIVE →</button>
        </div>
      </div>
    </div>
  );
}

function DeepEntryView({ dateKey, letters, photos, onChange, onPhotoSelect, onPhotoRemove, filledCount, error, onBack, onFinish }) {
  const t = useCountdown(10 * 60, true);
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={barStyle}>
        <button onClick={onBack} style={linkBtn}>← BACK</button>
        <TimerBar label={t.label} isDone={t.isDone} />
        <span style={Object.assign({}, tinyText, { color: filledCount > 0 ? BLUE : GRAY })}>
          {String(filledCount).padStart(2, "0")} / 26
        </span>
      </div>
      <p style={Object.assign({}, tinyText, { padding: "12px 24px 0" })}>{formatDateLabel(dateKey)}</p>

      <div style={Object.assign({}, wrap, { flex: 1 })}>
        {ALPHABET.map((letter, i) => {
          const filled = letters[letter].trim().length > 0;
          const photo = photos[letter];
          return (
            <div key={letter} style={{ padding: "12px 0", borderBottom: "1px solid " + LINE }}>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <span style={Object.assign({}, tinyText, { width: 22, flexShrink: 0, fontVariantNumeric: "tabular-nums" })}>
                  {String(i).padStart(2, "0")}
                </span>
                <span style={{ fontWeight: 700, fontSize: 20, width: 24, flexShrink: 0, color: filled ? BLUE : INK }}>{letter}</span>
                <input
                  type="text" value={letters[letter]}
                  onChange={e => onChange(letter, e.target.value)}
                  placeholder="—"
                  style={{ flex: 1, fontSize: 17, background: "transparent", border: "none", color: INK, padding: "4px 0", minWidth: 0 }}
                />
                <label style={{ flexShrink: 0, fontSize: 11, padding: "4px 8px", border: "1px solid " + (photo ? BLUE : GRAY), color: photo ? BLUE : GRAY, cursor: "pointer" }}>
                  {photo ? "PHOTO" : "+ IMG"}
                  <input type="file" accept="image/*" className="hiddenfile"
                    onChange={e => { onPhotoSelect(letter, e.target.files && e.target.files[0]); e.target.value = ""; }} />
                </label>
              </div>
              {photo && (
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginTop: 8, marginLeft: 38 }}>
                  <img src={photo} alt={letter} style={{ height: 80, width: 80, objectFit: "cover", border: "1px solid " + LINE }} />
                  <button onClick={() => onPhotoRemove(letter)} style={{ fontSize: 11, color: RED, padding: "4px 8px" }}>REMOVE</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={Object.assign({}, barStyle, { top: "auto", bottom: 0, borderTop: "1px solid " + LINE, borderBottom: "none" })}>
        <span style={Object.assign({}, tinyText, { color: error ? RED : GRAY })}>{error || "AUTO-SAVED"}</span>
        <button onClick={onFinish} style={{ padding: "12px 28px", fontSize: 14, letterSpacing: "0.15em", background: BLUE, color: "#FFF" }}>FINISH</button>
      </div>
    </div>
  );
}

function EasyEntryView({ dateKey, answers, onChange, filledCount, error, onBack, onFinish }) {
  const t = useCountdown(5 * 60, true);
  const [openHint, setOpenHint] = useState(null);
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={barStyle}>
        <button onClick={onBack} style={linkBtn}>← BACK</button>
        <TimerBar label={t.label} isDone={t.isDone} />
        <span style={Object.assign({}, tinyText, { color: filledCount > 0 ? BLUE : GRAY })}>
          {String(filledCount).padStart(2, "0")} / {EASY_QUESTIONS.length}
        </span>
      </div>
      <p style={Object.assign({}, tinyText, { padding: "12px 24px 0" })}>{formatDateLabel(dateKey)}</p>

      <div style={Object.assign({}, wrap, { flex: 1 })}>
        {EASY_QUESTIONS.map((q, i) => {
          const filled = answers[q.id].trim().length > 0;
          const hintOpen = openHint === q.id;
          return (
            <div key={q.id} style={{ padding: "16px 0", borderBottom: "1px solid " + LINE }}>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <span style={Object.assign({}, tinyText, { width: 22, flexShrink: 0, fontVariantNumeric: "tabular-nums" })}>
                  {String(i).padStart(2, "0")}
                </span>
                <span style={{ fontWeight: 700, fontSize: 15, width: 90, flexShrink: 0, color: filled ? BLUE : INK }}>{q.label}</span>
                <input
                  type="text" value={answers[q.id]}
                  onChange={e => onChange(q.id, e.target.value)}
                  placeholder="—"
                  style={{ flex: 1, fontSize: 17, background: "transparent", border: "none", color: INK, padding: "4px 0", minWidth: 0 }}
                />
                {q.id === "when" && (
                  <button onClick={() => onChange(q.id, formatNowStamp())}
                    style={{ flexShrink: 0, fontSize: 11, padding: "4px 8px", border: "1px solid " + BLUE, color: BLUE }}>
                    NOW
                  </button>
                )}
                <button onClick={() => setOpenHint(hintOpen ? null : q.id)}
                  style={{ flexShrink: 0, width: 24, height: 24, borderRadius: "50%", fontSize: 11, border: "1px solid " + GRAY, color: GRAY }}>
                  ?
                </button>
              </div>
              {hintOpen && <p style={{ marginTop: 8, marginLeft: 38, fontSize: 12, color: GRAY }}>{q.hint}</p>}
            </div>
          );
        })}
      </div>

      <div style={Object.assign({}, barStyle, { top: "auto", bottom: 0, borderTop: "1px solid " + LINE, borderBottom: "none" })}>
        <span style={Object.assign({}, tinyText, { color: error ? RED : GRAY })}>{error || "AUTO-SAVED"}</span>
        <button onClick={onFinish} style={{ padding: "12px 28px", fontSize: 14, letterSpacing: "0.15em", background: BLUE, color: "#FFF" }}>FINISH</button>
      </div>
    </div>
  );
}

function ArchiveView({ items, onBack, onOpen, onDelete }) {
  const [pendingDelete, setPendingDelete] = useState(null);
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={barStyle}>
        <button onClick={onBack} style={linkBtn}>← BACK</button>
        <span style={tinyText}>ARCHIVE</span>
        <span style={tinyText}>{String(items.length).padStart(2, "0")}</span>
      </div>

      <div style={Object.assign({}, wrap, { flex: 1, paddingTop: 16, paddingBottom: 40 })}>
        {items.length === 0 ? (
          <p style={{ fontSize: 14, color: GRAY, textAlign: "center", padding: "64px 0" }}>NO RECORDS YET</p>
        ) : (
          items.map((item, i) => (
            <button key={item.dateKey} onClick={() => onOpen(item.dateKey)}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "16px 0", borderBottom: "1px solid " + LINE, textAlign: "left" }}>
              <span style={Object.assign({}, tinyText, { width: 22, flexShrink: 0 })}>{String(i).padStart(2, "0")}</span>
              <span style={{ flex: 1, fontSize: 15, fontWeight: 700, color: INK }}>{formatDateLabel(item.dateKey)}</span>
              {item.easyCount > 0 && <span style={{ fontSize: 11, color: BLUE }}>EASY {item.easyCount}/{EASY_QUESTIONS.length}</span>}
              {item.deepCount > 0 && <span style={{ fontSize: 11, color: BLUE }}>DEEP {item.deepCount}/26</span>}
              <span
                onClick={e => {
                  e.stopPropagation();
                  if (pendingDelete === item.dateKey) { setPendingDelete(null); onDelete(item.dateKey, e); }
                  else setPendingDelete(item.dateKey);
                }}
                style={{ fontSize: 11, color: RED, padding: "4px 8px", fontWeight: pendingDelete === item.dateKey ? 700 : 400 }}>
                {pendingDelete === item.dateKey ? "SURE?" : "DEL"}
              </span>
            </button>
          ))
        )}
      </div>
    </div>
  );
}

function DetailView({ dateKey, data, photos, onBack }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={barStyle}>
        <button onClick={onBack} style={linkBtn}>← ARCHIVE</button>
        <span style={tinyText}>{formatDateLabel(dateKey)}</span>
        <span />
      </div>

      <div style={Object.assign({}, wrap, { flex: 1, paddingBottom: 40 })}>
        {data.hasEasy && (
          <React.Fragment>
            <p style={Object.assign({}, tinyText, { paddingTop: 24, paddingBottom: 8 })}>EASY</p>
            {EASY_QUESTIONS.map((q, i) => {
              const val = data.answers[q.id];
              const filled = val && val.trim().length > 0;
              return (
                <div key={q.id} style={{ display: "flex", alignItems: "center", gap: 16, padding: "12px 0", borderBottom: "1px solid " + LINE }}>
                  <span style={Object.assign({}, tinyText, { width: 22, flexShrink: 0 })}>{String(i).padStart(2, "0")}</span>
                  <span style={{ fontWeight: 700, fontSize: 15, width: 90, flexShrink: 0, color: filled ? BLUE : GRAY }}>{q.label}</span>
                  <span style={{ flex: 1, fontSize: 15, color: filled ? INK : "#C7C7C2" }}>{filled ? val : "—"}</span>
                </div>
              );
            })}
          </React.Fragment>
        )}

        {data.hasDeep && (
          <React.Fragment>
            <p style={Object.assign({}, tinyText, { paddingTop: 32, paddingBottom: 8 })}>DEEP</p>
            {ALPHABET.map((letter, i) => {
              const val = data.letters[letter];
              const filled = val && val.trim().length > 0;
              const photo = photos[letter];
              return (
                <div key={letter} style={{ padding: "12px 0", borderBottom: "1px solid " + LINE }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                    <span style={Object.assign({}, tinyText, { width: 22, flexShrink: 0, fontVariantNumeric: "tabular-nums" })}>{String(i).padStart(2, "0")}</span>
                    <span style={{ fontWeight: 700, fontSize: 20, width: 24, flexShrink: 0, color: filled ? BLUE : GRAY }}>{letter}</span>
                    <span style={{ flex: 1, fontSize: 16, color: filled ? INK : "#C7C7C2" }}>{filled ? val : "—"}</span>
                  </div>
                  {photo && (
                    <img src={photo} alt={letter} style={{ marginTop: 8, marginLeft: 38, maxHeight: 192, objectFit: "cover", border: "1px solid " + LINE }} />
                  )}
                </div>
              );
            })}
          </React.Fragment>
        )}

        {(data.hasEasy || data.hasDeep) && <ShareBar dateKey={dateKey} data={data} />}
      </div>
    </div>
  );
}

function ShareBar({ dateKey, data }) {
  const text = buildEntryText(dateKey, data);
  const [note, setNote] = useState(null);
  const [showText, setShowText] = useState(false);

  const handleShare = async () => {
    if (navigator.share) {
      try { await navigator.share({ text: text, title: "INDEX JOURNAL" }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      setNote("テキストをコピーしました。LINEやXなどに貼り付けてください。");
      setShowText(false);
      return;
    } catch (e) {}
    setShowText(true);
    setNote("下のテキストを長押しして、手動でコピーしてください。");
  };

  const handleCalendar = () => {
    try {
      downloadICS(dateKey, text);
      setNote("カレンダーファイル（.ics）を書き出しました。開くとカレンダーに追加できます。");
    } catch (e) {
      setShowText(true);
      setNote("書き出しに失敗しました。下のテキストをコピーしてカレンダーのメモに貼り付けてください。");
    }
  };

  const btn = { padding: "12px 24px", fontSize: 13, letterSpacing: "0.15em" };

  return (
    <div style={{ paddingTop: 24, borderTop: "1px solid " + LINE, marginTop: 32 }}>
      <p style={Object.assign({}, tinyText, { paddingBottom: 12 })}>SHARE</p>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        <button onClick={handleShare} style={Object.assign({}, btn, { background: INK, color: "#FFF" })}>SHARE</button>
        <button onClick={handleCalendar} style={Object.assign({}, btn, { border: "1px solid " + BLUE, color: BLUE })}>+ CALENDAR</button>
      </div>
      {note && <p style={{ fontSize: 12, color: BLUE, paddingTop: 12, lineHeight: 1.7 }}>{note}</p>}
      {showText && (
        <textarea readOnly value={text} rows={Math.min(12, text.split("\n").length + 1)}
          onFocus={e => e.target.select()}
          style={{ width: "100%", marginTop: 12, padding: 12, fontSize: 13, border: "1px solid " + LINE, color: INK, background: "#FAFAF8" }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<IndexJournal />);
</script>
</body>
</html>
